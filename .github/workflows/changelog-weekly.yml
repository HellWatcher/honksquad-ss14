name: "Weekly Changelog Update"

on:
  workflow_dispatch:
  schedule:
    # Saturdays 22:00 UTC = 6pm EDT (UTC-4). Shifts to 5pm during EST (UTC-5).
    - cron: '0 22 * * 6'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update HonksquadChangelog.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Select branch and fetch merged PRs
        id: setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check for an existing open changelog PR to accumulate into.
          EXISTING=$(gh pr list \
            --repo HellWatcher/honksquad-ss14 \
            --base release \
            --state open \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("chore/changelog-update-"))] | first')

          if [ "$EXISTING" != "null" ] && [ -n "$EXISTING" ]; then
            PR_NUM=$(echo "$EXISTING" | python3 -c "import sys,json; print(json.load(sys.stdin)['number'])")
            BRANCH=$(echo "$EXISTING" | python3 -c "import sys,json; print(json.load(sys.stdin)['headRefName'])")
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            echo "Resuming existing PR #$PR_NUM on branch $BRANCH."
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="chore/changelog-update-$(date -u +%Y-%m-%d)"
            git checkout -b "$BRANCH"
            echo "No existing PR. Starting fresh on $BRANCH."
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "pr_num=" >> "$GITHUB_OUTPUT"
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

          # Fetch merged PRs newer than the watermark (mergedAt timestamp).
          # Falls back to a fixed lookback if the watermark is missing or
          # in the legacy numeric format (which the Python script rewrites
          # on its next successful run).
          WATERMARK_FILE=Resources/Changelog/.changelog-watermark
          WATERMARK=""
          if [ -f "$WATERMARK_FILE" ]; then
            RAW=$(tr -d '[:space:]' < "$WATERMARK_FILE")
            if echo "$RAW" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'; then
              WATERMARK="$RAW"
            else
              echo "Watermark in legacy/invalid form ('$RAW'); falling back to lookback."
            fi
          fi
          if [ -z "$WATERMARK" ]; then
            # 30-day lookback; URL dedupe in the script handles any overlap.
            WATERMARK=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          fi
          echo "Fetching merged PRs with mergedAt > $WATERMARK"
          gh pr list \
            --repo HellWatcher/honksquad-ss14 \
            --state merged \
            --search "merged:>$WATERMARK" \
            --limit 500 \
            --json number,mergedAt,author,body \
            > /tmp/prs.json

      - name: "Scan for new :cl: entries"
        run: |
          python3 scripts/changelog-update.py \
            Resources/Changelog/HonksquadChangelog.yml \
            /tmp/prs.json \
            HellWatcher/honksquad-ss14 \
            --watermark-file Resources/Changelog/.changelog-watermark \
            --deny-file Resources/Changelog/.changelog-deny

      - name: Commit and open or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.setup.outputs.branch }}
          PR_NUM: ${{ steps.setup.outputs.pr_num }}
          IS_NEW: ${{ steps.setup.outputs.is_new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Resources/Changelog/HonksquadChangelog.yml \
                  Resources/Changelog/.changelog-watermark
          git diff --staged --quiet && echo "No new entries." && exit 0

          # No [skip ci] here. It suppresses push- and pull_request-triggered
          # workflows, which is every required check in the release ruleset
          # (build, YAML Linter, HONK audits, upstream-base and commit-prefix
          # checks). A changelog PR whose head commit carries it can never go
          # green, so auto-merge waits forever and the PR silently accumulates
          # commits until someone admin-merges it. That is what stranded #836
          # for two months.
          git commit -m "honksquad: chore: weekly changelog update"
          git push origin "$BRANCH"

          if [ "$IS_NEW" = "true" ]; then
            gh pr create \
              --repo HellWatcher/honksquad-ss14 \
              --base release \
              --head "$BRANCH" \
              --title "honksquad: chore: weekly changelog update $(date -u +%Y-%m-%d)" \
              --body "Automated weekly scan. Review entries before merging." \
              --label "A: Core Tech,T: Chore,size/XS,Changes: No C#"
          else
            echo "Updated existing PR #$PR_NUM."
          fi
