name: HONK / C# audit (weekly report)

on:
  schedule:
    # Weekly on Mondays at 07:15 UTC
    - cron: '15 7 * * 1'
  workflow_dispatch:

jobs:
  report:
    name: Full C# audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Add upstream remote and fetch master
        run: |
          git remote add upstream https://github.com/space-wizards/space-station-14.git
          git fetch --no-tags --depth=1 upstream master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full C# audit
        id: scan
        run: |
          set +e
          python3 scripts/honk/cs_audit.py \
            --fork-ref origin/release \
            --upstream-ref upstream/master \
            > cs-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

          DRIFT_COUNT=$(grep -cE '^\s+\S+\.cs' cs-report.txt || true)
          echo "drift_count=$DRIFT_COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "report<<REPORT_EOF"
            cat cs-report.txt
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check for existing open issue
        if: steps.scan.outputs.exit_code != '0'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --label "cs-drift" --state open --json number --jq '.[0].number // empty')
          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Create issue
        if: steps.scan.outputs.exit_code != '0' && steps.existing.outputs.issue_number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream C# drift: ${{ steps.scan.outputs.drift_count }} file(s) need cleanup" \
            --label "cs-drift" \
            --body "$(cat <<'EOF'
          The weekly audit found upstream C# files on `release` that have diverged from `upstream/master` outside `//HONK START` / `//HONK END` markers, or have malformed HONK blocks.

          Unmarked fork changes in upstream C# files are hard to locate at rebase time. Wrap them in HONK markers so they stand out.

          ### Audit output
          ```
          ${{ steps.scan.outputs.report }}
          ```

          ### To fix a single file
          Prefer the partial-class pattern (`Content.Shared/RussStation/<Subsystem>/<UpstreamSystemName>.Honk.cs`) where possible — it keeps the upstream file untouched. When the upstream file must be edited, wrap every fork change:

          ```csharp
          //HONK START - Brief description of why
          // fork-specific code
          //HONK END
          ```

          See CLAUDE.md § *HONK Marker Comments* and § *Access Analyzer Policy (RA0002)*.

          Created by the [HONK / C# audit (weekly report)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.
          EOF
          )"

      - name: Update existing issue
        if: steps.scan.outputs.exit_code != '0' && steps.existing.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ steps.existing.outputs.issue_number }} \
            --body "$(cat <<'EOF'
          Still drifting — **${{ steps.scan.outputs.drift_count }} file(s)** flagged by the latest audit.

          ```
          ${{ steps.scan.outputs.report }}
          ```

          From [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          EOF
          )"

      - name: Close issue if drift is gone
        if: steps.scan.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --label "cs-drift" --state open --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --comment "C# audit is clean. Closing."
          fi
