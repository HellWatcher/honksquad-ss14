[log]
path = "logs"
format = "log_%(date)s-%(time)s.txt"
level = 1
enabled = false

[net]
tickrate = 60
port = 1212
bindto = "::,0.0.0.0"
max_connections = 256

[status]
enabled = true

[game]
hostname = "Honk Squad"
lobbyenabled = true
maxplayers = 30
lobbyduration = 420
role_timers = false
role_whitelist = false
round_restart_time = 300
map = "Packed"
secret_weight_prototype = "LowpopSecret"

[shuttle]
auto_call_time = 90

[server]
lobby_name = "Honk Squad"
uptime_restart_minutes = 1440
rules_file = "StandardRuleset"

[vote]
restart_not_allowed_when_admin_online = false

[console]
loginlocal = true
login_host_user = "HellWatcher"

[hub]
advertise = false
tags = ""
server_url = ""
hub_urls = "https://hub.spacestation14.com/"

[auth]
mode = 1

[database]
engine = "sqlite"

[replay]
auto_record = true

[metrics]
# Prometheus metrics endpoint, scraped by a sibling monitoring container over
# the internal Docker network (not published to the host, so off the internet).
# host MUST be "*" (or "+"), NOT "0.0.0.0": the engine's SpaceWizards.HttpListener
# rejects 0.0.0.0 with HttpListenerException 50. The port is intentionally
# OMITTED: when deployed under Pelican/Wings, the egg's line-based config parser
# rewrites every "port =" line to the game allocation, so a metrics port here
# lands on the game port and crashes the listener. Omitting it uses the 44880
# CVar default, which has no line for the parser to clobber.
enabled = true
host = "*"
