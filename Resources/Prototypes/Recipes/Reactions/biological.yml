# HONK START - issue #645: chemistry can now synthesise species blood from a shared
# plasma intermediate. Plasma reaction is electrolyser-gated so it does not re-form
# inside centrifuge breakdowns, patient bloodstreams, or food prep where the same
# constituents naturally co-occur. Downstream (plasma + element) reactions are
# transitively gated because the only path to plasma is the electrolyser.
- type: reaction
  id: BloodPlasma
  requiredMixerCategories:
  - Electrolysis
  reactants:
    Water:
      amount: 3
    Protein:
      amount: 2
    Sugar:
      amount: 1
  products:
    BloodPlasma: 6

- type: reaction
  id: BloodSynth
  reactants:
    BloodPlasma:
      amount: 6
    Iron:
      amount: 1
  products:
    Blood: 7

- type: reaction
  id: CopperBloodSynth
  reactants:
    BloodPlasma:
      amount: 6
    Copper:
      amount: 1
  products:
    CopperBlood: 7

- type: reaction
  id: SulfurBloodSynth
  reactants:
    BloodPlasma:
      amount: 6
    Sulfur:
      amount: 1
    Hydrogen:
      amount: 1
  products:
    SulfurBlood: 8

- type: reaction
  id: AmmoniaBloodSynth
  reactants:
    BloodPlasma:
      amount: 6
    Ammonia:
      amount: 2
  products:
    AmmoniaBlood: 8

- type: reaction
  id: InsectBloodSynth
  reactants:
    BloodPlasma:
      amount: 6
    Sodium:
      amount: 1
    Chlorine:
      amount: 1
  products:
    InsectBlood: 8

- type: reaction
  id: SlimeSynth
  reactants:
    BloodPlasma:
      amount: 6
    Nitrogen:
      amount: 1
  products:
    Slime: 7

- type: reaction
  id: SapSynth
  reactants:
    BloodPlasma:
      amount: 6
    Sugar:
      amount: 1
  products:
    Sap: 7
# HONK END
