- type: reaction
  id: BloodBreakdown
  source: true
  requiredMixerCategories:
  - Centrifuge
  reactants:
    Blood:
      amount: 20
  products:
    Water: 11
    Iron: 0.5
    Sugar: 2
    CarbonDioxide: 3
    Protein: 4

- type: reaction
  id: InsectBloodBreakdown
  source: true
  requiredMixerCategories:
  - Centrifuge
  reactants:
    InsectBlood:
      amount: 30
  products:
    Water: 14
    Sodium: 3
    Chlorine: 1.5
    CarbonDioxide: 5.5
    Protein: 6

# HONK START - issue #645: rebalance Slime breakdown to the 20u species-blood template.
# Old 5u yield made the synth recipe a net loss and broke parity with other bloods.
- type: reaction
  id: SlimeBloodBreakdown
  source: true
  requiredMixerCategories:
  - Centrifuge
  reactants:
    Slime:
      amount: 20
  products:
    Water: 11
    Nitrogen: 0.5
    Sugar: 2
    CarbonDioxide: 3
    Protein: 4
# HONK END

# HONK START - issue #645: rebalance Sap breakdown to the 20u species-blood template.
# Folds the defining-element Sugar into a higher single output and adds the
# Protein/CO2 pair so synth -> centrifuge -> synth is no longer a Protein laundry.
- type: reaction
  id: SapBloodBreakdown
  source: true
  requiredMixerCategories:
  - Centrifuge
  reactants:
    Sap:
      amount: 20
  products:
    Water: 11
    Sugar: 2.5
    CarbonDioxide: 3
    Protein: 4
# HONK END

