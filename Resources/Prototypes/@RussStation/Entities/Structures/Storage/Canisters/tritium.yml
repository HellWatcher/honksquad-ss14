# tritium canister: layered Sprite parents and abstract Sprite parents inherited by the upstream entities (issue #689).
- type: entity
  abstract: true
  parent: GasCanister
  id: TritiumCanisterBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#3fcd40"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#83ff84"
        - state: hazard_stripes
          color: "#ffee00"
        - state: outline
          color: "#3fcd40"
        - state: lights

- type: entity
  abstract: true
  parent: GasCanisterBrokenBase
  id: TritiumCanisterBrokenBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#3fcd40"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#83ff84"
        - state: hazard_stripes
          color: "#ffee00"
        - state: outline
          color: "#3fcd40"
        - state: lights
        - state: broken
