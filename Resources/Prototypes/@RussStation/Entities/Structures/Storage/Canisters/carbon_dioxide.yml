# carbon_dioxide canister: layered Sprite parents and abstract Sprite parents inherited by the upstream entities (issue #689).
- type: entity
  abstract: true
  parent: GasCanister
  id: CarbonDioxideCanisterBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#4e4c48"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#fffaf1"
        - state: double_stripe
          color: "#eaeaea"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#757575"
        - state: outline
          color: "#4e4c48"
        - state: lights

- type: entity
  abstract: true
  parent: GasCanisterBrokenBase
  id: CarbonDioxideCanisterBrokenBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#4e4c48"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#fffaf1"
        - state: double_stripe
          color: "#eaeaea"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#757575"
        - state: outline
          color: "#4e4c48"
        - state: lights
        - state: broken
