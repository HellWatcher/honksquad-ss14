# proto_nitrate canister: layered Sprite parents and concrete entities (upright + broken).
- type: entity
  abstract: true
  parent: GasCanister
  id: ProtoNitrateCanisterBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#008200"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#4cff4c"
        - state: double_stripe
          color: "#33cc33"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#196619"
        - state: outline
          color: "#008200"
        - state: lights

- type: entity
  abstract: true
  parent: GasCanisterBrokenBase
  id: ProtoNitrateCanisterBrokenBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#008200"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#4cff4c"
        - state: double_stripe
          color: "#33cc33"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#196619"
        - state: outline
          color: "#008200"
        - state: lights
        - state: broken

- type: entity
  parent: ProtoNitrateCanisterBase
  id: ProtoNitrateCanister
  name: proto-nitrate canister
  description: A canister that can contain any type of gas. This one is supposed to contain proto-nitrate. It can be attached to connector ports using a wrench.
  components:
    - type: GasCanister
      air:
        volume: 1500
        moles:
          ProtoNitrate: 2769.36
        temperature: 293.15
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:SpawnEntitiesBehavior
          spawn:
            ProtoNitrateCanisterBroken:
              min: 1
              max: 1
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:DumpCanisterBehavior

- type: entity
  parent: ProtoNitrateCanisterBrokenBase
  id: ProtoNitrateCanisterBroken
  categories: [ HideSpawnMenu ]
