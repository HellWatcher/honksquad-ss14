# air canister: layered Sprite parents and abstract Sprite parents inherited by the upstream entities (issue #689).
- type: entity
  abstract: true
  parent: GasCanister
  id: AirCanisterBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#c6c0b5"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#fff9ef"
        - state: outline
          color: "#c6c0b5"
        - state: lights

- type: entity
  abstract: true
  parent: GasCanisterBrokenBase
  id: AirCanisterBrokenBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#c6c0b5"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#fff9ef"
        - state: outline
          color: "#c6c0b5"
        - state: lights
        - state: broken
