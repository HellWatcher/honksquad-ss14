# hyper_noblium canister: layered Sprite parents and concrete entities (upright + broken).
- type: entity
  abstract: true
  parent: GasCanister
  id: HyperNobliumCanisterBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#6399fc"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#92b8ff"
        - state: double_stripe
          color: "#b2b2b2"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#595959"
        - state: outline
          color: "#6399fc"
        - state: lights

- type: entity
  abstract: true
  parent: GasCanisterBrokenBase
  id: HyperNobliumCanisterBrokenBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#6399fc"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#92b8ff"
        - state: double_stripe
          color: "#b2b2b2"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#595959"
        - state: outline
          color: "#6399fc"
        - state: lights
        - state: broken

- type: entity
  parent: HyperNobliumCanisterBase
  id: HyperNobliumCanister
  name: hyper-noblium canister
  description: A canister that can contain any type of gas. This one is supposed to contain hyper-noblium. It can be attached to connector ports using a wrench.
  components:
    - type: GasCanister
      air:
        volume: 1500
        moles:
          HyperNoblium: 2769.36
        temperature: 293.15
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:SpawnEntitiesBehavior
          spawn:
            HyperNobliumCanisterBroken:
              min: 1
              max: 1
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:DumpCanisterBehavior

- type: entity
  parent: HyperNobliumCanisterBrokenBase
  id: HyperNobliumCanisterBroken
  categories: [ HideSpawnMenu ]
