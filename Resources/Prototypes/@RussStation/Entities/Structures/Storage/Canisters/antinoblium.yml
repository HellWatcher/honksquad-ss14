# antinoblium canister: layered Sprite parents and concrete entities (upright + broken).
- type: entity
  abstract: true
  parent: GasCanister
  id: AntinobliumCanisterBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#333333"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#ffffff"
        - state: double_stripe
          color: "#fefb30"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#7f7d18"
        - state: outline
          color: "#333333"
        - state: lights

- type: entity
  abstract: true
  parent: GasCanisterBrokenBase
  id: AntinobliumCanisterBrokenBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#333333"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#ffffff"
        - state: double_stripe
          color: "#fefb30"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#7f7d18"
        - state: outline
          color: "#333333"
        - state: lights
        - state: broken

- type: entity
  parent: AntinobliumCanisterBase
  id: AntinobliumCanister
  name: antinoblium canister
  description: A canister that can contain any type of gas. This one is supposed to contain antinoblium. It can be attached to connector ports using a wrench.
  components:
    - type: GasCanister
      air:
        volume: 1500
        moles:
          Antinoblium: 2769.36
        temperature: 293.15
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:SpawnEntitiesBehavior
          spawn:
            AntinobliumCanisterBroken:
              min: 1
              max: 1
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:DumpCanisterBehavior

- type: entity
  parent: AntinobliumCanisterBrokenBase
  id: AntinobliumCanisterBroken
  categories: [ HideSpawnMenu ]
