# storage canister: layered Sprite parents and abstract Sprite parents inherited by the upstream entities (issue #689).
- type: entity
  abstract: true
  parent: GasCanister
  id: StorageCanisterBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#6b6b80"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#e1e1ff"
        - state: outline
          color: "#6b6b80"
        - state: lights

- type: entity
  abstract: true
  parent: GasCanisterBrokenBase
  id: StorageCanisterBrokenBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#6b6b80"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#e1e1ff"
        - state: outline
          color: "#6b6b80"
        - state: lights
        - state: broken
