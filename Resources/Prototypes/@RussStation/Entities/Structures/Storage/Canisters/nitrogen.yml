# nitrogen canister: layered Sprite parents and abstract Sprite parents inherited by the upstream entities (issue #689).
- type: entity
  abstract: true
  parent: GasCanister
  id: NitrogenCanisterBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#e9ff5c"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#efff8c"
        - state: double_stripe
          color: "#f4fce8"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#7a7e74"
        - state: outline
          color: "#e9ff5c"
        - state: lights

- type: entity
  abstract: true
  parent: GasCanisterBrokenBase
  id: NitrogenCanisterBrokenBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#e9ff5c"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#efff8c"
        - state: double_stripe
          color: "#f4fce8"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#7a7e74"
        - state: outline
          color: "#e9ff5c"
        - state: lights
        - state: broken
