# healium canister: layered Sprite parents and concrete entities (upright + broken).
- type: entity
  abstract: true
  parent: GasCanister
  id: HealiumCanisterBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#009823"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#4cff75"
        - state: double_stripe
          color: "#ff0e00"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#7f0700"
        - state: outline
          color: "#009823"
        - state: lights

- type: entity
  abstract: true
  parent: GasCanisterBrokenBase
  id: HealiumCanisterBrokenBase
  components:
    - type: Sprite
      sprite: "@RussStation/Structures/Storage/canister_layered.rsi"
      layers:
        - state: base
          color: "#009823"
        - state: multi_shader
          shader: SpriteMultiply
        - state: add_shader
          shader: SpriteAdd
          color: "#4cff75"
        - state: double_stripe
          color: "#ff0e00"
        - state: double_stripe_shader
          shader: SpriteSubtract
          color: "#7f0700"
        - state: outline
          color: "#009823"
        - state: lights
        - state: broken

- type: entity
  parent: HealiumCanisterBase
  id: HealiumCanister
  name: healium canister
  description: A canister that can contain any type of gas. This one is supposed to contain healium. It can be attached to connector ports using a wrench.
  components:
    - type: GasCanister
      air:
        volume: 1500
        moles:
          Healium: 2769.36
        temperature: 293.15
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:SpawnEntitiesBehavior
          spawn:
            HealiumCanisterBroken:
              min: 1
              max: 1
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:DumpCanisterBehavior

- type: entity
  parent: HealiumCanisterBrokenBase
  id: HealiumCanisterBroken
  categories: [ HideSpawnMenu ]
