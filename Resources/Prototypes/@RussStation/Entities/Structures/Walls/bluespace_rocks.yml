# HONK - Issue #302: rock vein variants for Bluespace ore. Mirrors the Diamond
# wall set in Resources/Prototypes/Entities/Structures/Walls/asteroid.yml. Mining-
# scanner overlay sprite lives in @RussStation/Structures/Walls/rock_bluespace.rsi
# so the upstream rock.rsi doesn't need a state added.

- type: entity
  parent: AsteroidRock
  id: AsteroidRockBluespace
  description: An ore vein crystallized with bluespace.
  suffix: Bluespace
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: OreBluespace
    - type: Sprite
      layers:
        - state: rock_asteroid
        - map: ["enum.EdgeLayer.South"]
          state: rock_asteroid_south
        - map: ["enum.EdgeLayer.East"]
          state: rock_asteroid_east
        - map: ["enum.EdgeLayer.North"]
          state: rock_asteroid_north
        - map: ["enum.EdgeLayer.West"]
          state: rock_asteroid_west
        - sprite: "@RussStation/Structures/Walls/rock_bluespace.rsi"
          state: rock_bluespace
          map: ["enum.MiningScannerVisualLayers.Overlay"]

