# Skaven survival tank (#481). Skaven breathe Ammonia (atmos miasma) instead of O2,
# so they get the same survival-kit shape Vox have for nitrogen: a double-capacity
# emergency tank pre-filled with the species' breathing gas. Reuses the upstream
# emergency_double.rsi sprite tinted to the Ammonia reagent's color (#77b58e) so we
# don't ship a near-duplicate RSI just for the hue. The gas content is what matters
# mechanically.

- type: entity
  parent: DoubleEmergencyOxygenTank
  id: DoubleEmergencyAmmoniaTank
  name: double emergency ammonia tank
  description: A high-grade dual-tank emergency life support container, filled with breathable miasma. It can hold 2.5 L of gas.
  components:
    - type: Sprite
      sprite: Objects/Tanks/emergency_double.rsi
      color: "#77b58e"
    - type: Item
      sprite: Objects/Tanks/emergency_double.rsi
      color: "#77b58e"
      storedSprite:
        state: storage
        sprite: Objects/Tanks/emergency_double.rsi
    - type: Clothing
      sprite: Objects/Tanks/emergency_double.rsi
      color: "#77b58e"

- type: entity
  id: DoubleEmergencyAmmoniaTankFilled
  parent: DoubleEmergencyAmmoniaTank
  suffix: Filled
  components:
    - type: GasTank
      outputPressure: 21.3
      air:
        # 15 minutes
        volume: 2.5
        moles:
          Ammonia: 1.025689525
        temperature: 293.15

# Full-size 5 L ammonia tank for refilling Skaven survival kits and stocking
# atmos/medbay. Reuses Objects/Tanks/red.rsi tinted with the Ammonia reagent color
# (#77b58e), same trick as the double-emergency tank above.

- type: entity
  parent: NitrogenTank
  id: AmmoniaTank
  name: ammonia tank
  description: A standard cylindrical gas tank for ammonia. It can hold 5 L of gas.
  components:
  - type: Sprite
    sprite: Objects/Tanks/red.rsi
    color: "#77b58e"
  - type: Item
    sprite: Objects/Tanks/red.rsi
    color: "#77b58e"
  - type: Clothing
    sprite: Objects/Tanks/red.rsi
    color: "#77b58e"

- type: entity
  id: AmmoniaTankFilled
  parent: AmmoniaTank
  suffix: Filled
  name: ammonia tank
  components:
  - type: GasTank
    air:
      # 31 minutes
      volume: 5
      moles:
        Ammonia: 2.051379050
      temperature: 293.15
