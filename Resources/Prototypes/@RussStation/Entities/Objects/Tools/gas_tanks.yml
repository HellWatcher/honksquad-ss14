# Layered gas tank prototypes (issue #692)
# One test entity per gas from Tools/canister_sprite_baker/gases.md.
# base/band: white sprites with color: tint. multi layers: dark overlay SpriteMultiply.

# --- Upstream gases ---

- type: entity
  parent: GasTankRoundBase
  id: AirTankLayered
  name: air tank (layered)
  description: Test entity — air colors.
  components:
    - type: Sprite
      sprite: "@RussStation/Objects/Tanks/standard.rsi"
      layers:
        - state: base
          color: "#c6c0b5"
        - state: multi-base
          shader: SpriteMultiply
        - state: band
          color: "#c6c0b5"
        - state: multi-band
          shader: SpriteMultiply
        - state: detail

