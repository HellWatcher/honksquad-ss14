# Autosurgeon - single-use device that installs a cybernetic organ without surgery.

- type: entity
  parent: BaseItem
  id: BaseAutosurgeon
  name: autosurgeon
  description: A single-use device that automatically installs a cybernetic organ. No surgery required.
  abstract: true
  components:
  - type: Autosurgeon
  - type: Sprite
    sprite: "@RussStation/Objects/Specific/Medical/autosurgeon.rsi"
    layers:
    - state: autosurgeon

# ============================================================
# Heart autosurgeons
# ============================================================

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonHeartBasic
  name: autosurgeon (basic cybernetic heart)
  description: Installs a basic cybernetic heart. Single use.
  components:
    - type: Autosurgeon
      organPrototype: OrganCyberneticHeartBasic

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonHeartStandard
  name: autosurgeon (cybernetic heart)
  description: Installs a standard cybernetic heart. Single use.
  components:
    - type: Autosurgeon
      organPrototype: OrganCyberneticHeartStandard

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonHeartAdvanced
  name: autosurgeon (advanced cybernetic heart)
  description: Installs an advanced cybernetic heart. Single use.
  components:
    - type: Autosurgeon
      organPrototype: OrganCyberneticHeartAdvanced

