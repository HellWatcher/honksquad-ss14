- type: entity
  id: SkillchipStation
  name: skillchip station
  description: A neural interface chair that reads and writes skill implants. Sit still.
  components:
  - type: Sprite
    sprite: "@RussStation/Machines/skillchip_station.rsi"
    state: icon
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: Transform
    anchored: true
  - type: SkillchipStation
  - type: UserInterface
    interfaces:
      enum.SkillchipStationUiKey.Key:
        type: SkillchipStationBoundUserInterface
  - type: ActivatableUI
    key: enum.SkillchipStationUiKey.Key
  - type: ContainerContainer
    containers:
      skillchip_slot: !type:ContainerSlot {}
