- type: entity
  id: SkillchipStation
  parent: [BaseStructure, ConstructibleMachine]
  name: skillchip station
  description: A neural interface chair that reads and writes skill implants. Sit still.
  components:
  - type: Sprite
    sprite: "@RussStation/Machines/skillchip_station.rsi"
    layers:
    - state: implantchair_open
      map: ["skillchip_station_layer"]
    noRot: true
  - type: InteractionOutline
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SkillchipStationVisuals.Status:
        skillchip_station_layer:
          Occupied: { state: implantchair_occupied }
          Open: { state: implantchair_open }
  - type: Climbable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: Transform
    anchored: true
  - type: SkillchipStation
  - type: UserInterface
    interfaces:
      enum.SkillchipStationUiKey.Key:
        type: SkillchipStationBoundUserInterface
  - type: ActivatableUI
    key: enum.SkillchipStationUiKey.Key
  - type: ContainerContainer
    containers:
      skillchip_slot: !type:ContainerSlot {}
      scanner-body: !type:ContainerSlot {}
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Machine
    board: SkillchipStationMachineCircuitboard
  - type: WiresPanel
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: Damageable
    damageModifierSet: StrongMetallic
  # Upstream moved damageContainer off Damageable onto the new Injurable component.
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
