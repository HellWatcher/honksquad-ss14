# Ported from RussStation SS13 (CC-BY-SA-3.0, sprites by skeyuui). Russ ships
# tail/ear sprites split across FRONT and BEHIND files where each file fills
# only the directions where its layer is "in front of" or "behind" the body;
# we composite the pair into one all-direction PNG (skaven_parts.rsi states)
# so a single SS14 marking on a single HumanoidVisualLayer covers all four
# rotations. The wagging-tail variant exists in the RSI but isn't yet
# user-pickable; a follow-up can swap it in at runtime for an emote.

- type: marking
  id: SkavenTail
  bodyPart: Tail
  forcedColoring: true
  groupWhitelist: [Skaven]
  coloring:
    default:
      type: !type:SkinColoring
  sprites:
    - sprite: "@RussStation/Mobs/Customization/skaven_parts.rsi"
      state: tail

- type: marking
  id: SkavenEars
  bodyPart: HeadTop
  forcedColoring: true
  groupWhitelist: [Skaven]
  coloring:
    default:
      type: !type:SkinColoring
  sprites:
    - sprite: "@RussStation/Mobs/Customization/skaven_parts.rsi"
      state: ears

# Animated tail variant lives here for future runtime swaps (see vox/lizard
# wagging precedent). groupWhitelist is empty so it doesn't show in the
# species editor.
- type: marking
  id: SkavenTailWagging
  bodyPart: Tail
  forcedColoring: true
  groupWhitelist: []
  coloring:
    default:
      type: !type:SkinColoring
  sprites:
    - sprite: "@RussStation/Mobs/Customization/skaven_parts.rsi"
      state: tail_wagging
