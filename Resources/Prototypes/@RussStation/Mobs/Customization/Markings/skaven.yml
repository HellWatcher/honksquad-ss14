# Ported from RussStation SS13 (AGPL-3.0). Russ ships FRONT and BEHIND tail/ear
# sprites; SS14 markings only attach to one HumanoidVisualLayer at a time, so
# this file exposes the FRONT sprites under SS14's normal Tail / HeadTop layers.
# The extracted BEHIND and wagging-anim variants live in skaven_parts.rsi and
# stay unwired for now; a follow-up can split them onto TailOverlay / Special
# layers (and animate the wagging via a runtime swap) once the basic look ships.

- type: marking
  id: SkavenTail
  bodyPart: Tail
  forcedColoring: true
  groupWhitelist: [Skaven]
  coloring:
    default:
      type: !type:SkinColoring
  sprites:
    - sprite: "@RussStation/Mobs/Customization/skaven_parts.rsi"
      state: tail

- type: marking
  id: SkavenEars
  bodyPart: HeadTop
  forcedColoring: true
  groupWhitelist: [Skaven]
  coloring:
    default:
      type: !type:SkinColoring
  sprites:
    - sprite: "@RussStation/Mobs/Customization/skaven_parts.rsi"
      state: ears
