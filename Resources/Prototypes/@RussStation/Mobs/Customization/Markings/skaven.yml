# Ported from RussStation SS13 (CC-BY-SA-3.0, sprites by skeyuui).
# Tail uses a single Tail-layer marking (matches lizard's tail_smooth pattern).
# The composite tail.png masks BEHIND pixels overlapping the body silhouette
# so SS14's always-on-top Tail rendering looks right; FRONT pixels overlay
# unchanged for the north view. Ears stack BEHIND+FRONT on HeadTop.

# Reuse reptilian's snout sprites — same source data russstation pulls from
# (lizard_misc.dmi). Round is the default since the russstation skaven preview
# composites skaven_head with m_snout_round_ADJ.
- type: marking
  id: SkavenSnout
  bodyPart: Snout
  forcedColoring: true
  groupWhitelist: [Skaven]
  coloring:
    default:
      type: !type:SkinColoring
  sprites:
    - sprite: Mobs/Customization/reptilian_parts.rsi
      state: snout_round

- type: marking
  id: SkavenSnoutSharp
  bodyPart: Snout
  forcedColoring: true
  groupWhitelist: [Skaven]
  coloring:
    default:
      type: !type:SkinColoring
  sprites:
    - sprite: Mobs/Customization/reptilian_parts.rsi
      state: snout_sharp

- type: marking
  id: SkavenSnoutRoundLight
  bodyPart: Snout
  forcedColoring: true
  groupWhitelist: [Skaven]
  coloring:
    default:
      type: !type:SkinColoring
  sprites:
    - sprite: Mobs/Customization/reptilian_parts.rsi
      state: snout_roundlight

- type: marking
  id: SkavenSnoutSharpLight
  bodyPart: Snout
  forcedColoring: true
  groupWhitelist: [Skaven]
  coloring:
    default:
      type: !type:SkinColoring
  sprites:
    - sprite: Mobs/Customization/reptilian_parts.rsi
      state: snout_sharplight

- type: marking
  id: SkavenTail
  bodyPart: Tail
  forcedColoring: true
  groupWhitelist: [Skaven]
  coloring:
    default:
      type: !type:SimpleColoring
        color: "#e5a8a8"
  sprites:
    - sprite: "@RussStation/Mobs/Customization/skaven_parts.rsi"
      state: tail

- type: marking
  id: SkavenEars
  bodyPart: HeadTop
  forcedColoring: true
  groupWhitelist: [Skaven]
  coloring:
    default:
      type: !type:SkinColoring
  sprites:
    - sprite: "@RussStation/Mobs/Customization/skaven_parts.rsi"
      state: ears_behind
    - sprite: "@RussStation/Mobs/Customization/skaven_parts.rsi"
      state: ears_front

# Animated tail variant lives here for future runtime swaps (see vox/lizard
# wagging precedent). groupWhitelist is empty so it doesn't show in the
# species editor.
# Suffix must match WaggingComponent.Suffix (default "Animated") so the
# wag system can swap SkavenTail -> SkavenTailAnimated at runtime.
- type: marking
  id: SkavenTailAnimated
  bodyPart: Tail
  forcedColoring: true
  groupWhitelist: []
  coloring:
    default:
      type: !type:SimpleColoring
        color: "#e5a8a8"
  sprites:
    - sprite: "@RussStation/Mobs/Customization/skaven_parts.rsi"
      state: tail_wagging

