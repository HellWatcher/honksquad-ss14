# Skaven-issue survival box (#481). Same shape as BoxSurvivalEngineering's extended
# variant (one extended-capacity tank + the rest of the standard survival contents),
# just with the species-appropriate gas. Paired with a second extended ammonia tank
# pre-equipped in pocket1 via the LoadoutSpeciesSkavenAmmonia loadout, so a Skaven
# round-starts with two extended tanks - one in the box, one in pocket.

- type: entity
  parent: BoxSurvivalEngineering
  id: BoxSurvivalSkaven
  suffix: Extended Ammonia
  components:
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
            - id: ClothingMaskBreath
            - id: ExtendedEmergencyAmmoniaTankFilled
            - id: EmergencyMedipen
            - id: Flare
            - id: FoodSnackNutribrick
            - id: DrinkWaterBottleFull
    - type: Label
      currentLabel: reagent-name-ammonia
