# Skaven-issue survival box (#481). Carries one double-capacity ammonia tank plus
# the standard survival contents. Paired with a second double ammonia tank pre-
# equipped in pocket1 via LoadoutSpeciesSkavenAmmonia, so a Skaven round-starts
# with two double tanks - one in the box, one in pocket.

- type: entity
  parent: BoxSurvivalEngineering
  id: BoxSurvivalSkaven
  suffix: Double Ammonia
  components:
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
            # Mask omitted: Skaven auto-spawn wearing ClothingMaskGasSkaven
            # via LoadoutSpeciesBreathToolSkaven, and the mask's Small footprint
            # pushed the 9-cell box over capacity (the water bottle no longer
            # fit). Standard BoxSurvival uses the Tiny ClothingMaskBreath here.
            - id: DoubleEmergencyAmmoniaTankFilled
            - id: EmergencyMedipen
            - id: Flare
            - id: FoodSnackNutribrick
            - id: DrinkWaterBottleFull
    - type: Label
      currentLabel: reagent-name-ammonia
