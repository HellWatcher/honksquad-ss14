# Lowpop antag rules for ~10-15 player servers.
# These inherit from upstream rules and only override minPlayers + antag ratios.
#
# Migrated to the new AntagSelection schema: `definitions:` was replaced upstream by
# `antags:` holding !type:AntagCountSelector entries, and every non-numeric field
# (prefRoles / blacklist / briefing / components / startingGear / mindRoles) now lives
# on the `antagSpecifier` prototype referenced by `proto:`. All that boilerplate is
# therefore dropped here and inherited from upstream; only the lowpop tuning remains.

- type: entity
  parent: Traitor
  id: LowpopTraitor
  components:
    - type: GameRule
      minPlayers: 5
    - type: AntagSelection
      antags:
        - !type:LinearAntagCount
          proto: Traitor
          playerRatio: 4
          range:
            min: 1
            max: 5

- type: entity
  parent: Revolutionary
  id: LowpopRevolutionary
  components:
    - type: GameRule
      minPlayers: 8
    - type: AntagSelection
      antags:
        - !type:LinearAntagCount
          proto: HeadRev
          playerRatio: 10
          range:
            min: 1
            max: 2

- type: entity
  parent: Changeling
  id: LowpopChangeling
  components:
    - type: GameRule
      minPlayers: 10
    - type: AntagSelection
      antags:
        - !type:LinearAntagCount
          proto: Changeling
          playerRatio: 10
          range:
            min: 1
            max: 2

- type: entity
  parent: Zombie
  id: LowpopZombie
  components:
    - type: GameRule
      minPlayers: 10
    - type: AntagSelection
      antags:
        - !type:LinearAntagCount
          proto: InitialInfected
          playerRatio: 10
          range:
            min: 1
            max: 3
