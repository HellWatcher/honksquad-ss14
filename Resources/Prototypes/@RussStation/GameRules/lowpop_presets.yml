# Lowpop game presets for ~10-15 player servers.
# Use by setting the CVar: game.secret_weight_prototype = LowpopSecret

- type: gamePreset
  id: LowpopTraitor
  alias:
    - lowpoptraitor
  name: traitor-title
  description: traitor-description
  showInVote: false
  rules:
    - DummyNonAntagChance
    - LowpopTraitor
    - SubGamemodesRuleNoWizard
    - LowpopRampingStationEventScheduler
    - MeteorSwarmMildScheduler
    - SpaceTrafficControlEventScheduler
    - BasicRoundstartVariation

- type: gamePreset
  id: LowpopRevolutionary
  alias:
    - lowpoprev
  name: rev-title
  description: rev-description
  showInVote: false
  rules:
    - DummyNonAntagChance
    - LowpopRevolutionary
    - SubGamemodesRuleNoWizard
    - LowpopRampingStationEventScheduler
    - MeteorSwarmMildScheduler
    - SpaceTrafficControlEventScheduler
    - BasicRoundstartVariation

# No LowpopChangeling preset: upstream still has the changeling antag behind
# `setPreference: false` (WIP), and profile validation drops any antag preference whose
# prototype has that flag. With no player able to opt in, the round would start with zero
# changelings. Upstream gates it the same way, by shipping no preset that reaches the rule.
# The LowpopChangeling rule itself is kept in lowpop_roundstart.yml, so re-adding a preset
# block here is all that is needed once upstream flips the flag.

- type: gamePreset
  id: LowpopZombie
  alias:
    - lowpopzombie
  name: zombie-title
  description: zombie-description
  showInVote: false
  rules:
    - LowpopZombie
    - LowpopRampingStationEventScheduler
    - MeteorSwarmMildScheduler
    - SpaceTrafficControlEventScheduler
    - BasicRoundstartVariation

- type: weightedRandom
  id: LowpopSecret
  weights:
    LowpopTraitor: 0.55
    LowpopRevolutionary: 0.15
    LowpopZombie: 0.10
    Survival: 0.10
