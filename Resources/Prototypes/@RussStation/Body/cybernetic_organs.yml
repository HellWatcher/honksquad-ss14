      category: Lungs
    - type: Lung
    - type: Metabolizer
      stages: [Respiration]
    - type: SolutionContainerManager
      solutions:
        Lung:
          maxVol: 100.0
          canReact: false
    - type: Sprite
      layers:
        - state: lung-l
        - state: lung-r
    - type: CyberneticOrgan
      tier: Standard
      empEffect: BreathingFailure
      empVulnerability: 1.0

- type: entity
  parent: [OrganBase, OrganCyberneticInternal]
  id: OrganCyberneticLungsAdvanced
