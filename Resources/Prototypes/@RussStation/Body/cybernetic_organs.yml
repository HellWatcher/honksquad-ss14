# Cybernetic organ replacements - shared base. Specific organ prototypes (Heart/Lungs/Eyes/etc.)
# land alongside their per-organ feature PRs and inherit OrganCyberneticInternal for the shared
# RSI path. GibbableOrgan is inherited but suppressed in C# (GibbableOrganSystem skips
# CyberneticOrgan entities).
# Sprites: @RussStation/Objects/Cybernetics/cybernetic_organs.rsi (Katyes, CC-BY-SA-4.0)

- type: entity
  id: OrganCyberneticInternal
  abstract: true
  components:
  - type: Sprite
    sprite: "@RussStation/Objects/Cybernetics/cybernetic_organs.rsi"

# ============================================================
# HEART - EmpEffect: CardiacArrest
# ============================================================

- type: entity
  parent: [OrganBaseHeart, OrganCyberneticInternal]
  id: OrganCyberneticHeartBasic
  name: basic cybernetic heart
  description: A cheap cybernetic heart replacement. Keeps you alive, barely.
  components:
  - type: Sprite
    sprite: "@RussStation/Objects/Cybernetics/cybernetic_organs.rsi"
    layers:
    - state: heart-plastic-on
  - type: Metabolizer
    maxReagents: 1
  - type: CyberneticOrgan
    tier: Basic
    empEffect: CardiacArrest
    empVulnerability: 1.5

- type: entity
  parent: [OrganBaseHeart, OrganCyberneticInternal]
  id: OrganCyberneticHeartStandard
  name: cybernetic heart
  description: A reliable cybernetic heart. Performs identically to a biological one.
  components:
  - type: Sprite
    sprite: "@RussStation/Objects/Cybernetics/cybernetic_organs.rsi"
    layers:
    - state: heart-plasma-on
  - type: CyberneticOrgan
    tier: Standard
    empEffect: CardiacArrest
    empVulnerability: 1.0

- type: entity
  parent: [OrganBaseHeart, OrganCyberneticInternal]
  id: OrganCyberneticHeartAdvanced
  name: advanced cybernetic heart
  description: A state-of-the-art cybernetic heart with enhanced circulatory efficiency.
  components:
  - type: Sprite
    sprite: "@RussStation/Objects/Cybernetics/cybernetic_organs.rsi"
    layers:
    - state: heart-bluespace-on
  - type: Metabolizer
    maxReagents: 3
  - type: CyberneticOrgan
    tier: Advanced
    empEffect: CardiacArrest
    empVulnerability: 0.5
  - type: CyberneticHeart

# ============================================================
# LUNGS - EmpEffect: BreathingFailure
# ============================================================

- type: entity
  parent: [OrganBaseLungs, OrganCyberneticInternal]
  id: OrganCyberneticLungsBasic
  name: basic cybernetic lungs
  description: Budget cybernetic lungs. You'll breathe, but don't push it.
  components:
  - type: Sprite
    sprite: "@RussStation/Objects/Cybernetics/cybernetic_organs.rsi"
    layers:
    - state: lung-plastic-l
    - state: lung-plastic-r
  - type: SolutionContainerManager
    solutions:
      Lung:
        maxVol: 75.0
        canReact: false
  - type: Metabolizer
    stages: [Respiration]
    maxReagents: 2
  - type: CyberneticOrgan
    tier: Basic
    empEffect: BreathingFailure
    empVulnerability: 1.5

- type: entity
  parent: [OrganBaseLungs, OrganCyberneticInternal]
  id: OrganCyberneticLungsStandard
  name: cybernetic lungs
  description: Reliable cybernetic lungs. Breathe easy.
  components:
  - type: Sprite
    sprite: "@RussStation/Objects/Cybernetics/cybernetic_organs.rsi"
    layers:
    - state: lung-plasma-l
    - state: lung-plasma-r
  - type: Metabolizer
    stages: [Respiration]
  - type: CyberneticOrgan
    tier: Standard
    empEffect: BreathingFailure
    empVulnerability: 1.0

- type: entity
  parent: [OrganBaseLungs, OrganCyberneticInternal]
  id: OrganCyberneticLungsAdvanced
  name: advanced cybernetic lungs
  description: High-end cybernetic lungs with extended oxygen reserves.
  components:
  - type: Sprite
    sprite: "@RussStation/Objects/Cybernetics/cybernetic_organs.rsi"
    layers:
    - state: lung-bluespace-l
    - state: lung-bluespace-r
  - type: SolutionContainerManager
    solutions:
      Lung:
        maxVol: 130.0
        canReact: false
  - type: Metabolizer
    stages: [Respiration]
  - type: CyberneticOrgan
    tier: Advanced
    empEffect: BreathingFailure
    empVulnerability: 0.5
  - type: CyberneticLungs

# ============================================================
# EYES - EmpEffect: Flicker
# ============================================================

- type: entity
  parent: [OrganBaseEyes, OrganCyberneticInternal]
  id: OrganCyberneticEyesBasic
  name: basic cybernetic eyes
  description: Cheap cybernetic eyes. Functional but ordinary -- no better than the ones you were born with.
  components:
  - type: Sprite
    sprite: "@RussStation/Objects/Cybernetics/cybernetic_organs.rsi"
    layers:
    - state: eyeball-plastic-l
    - state: eyeball-plastic-r
  - type: VisualOrganMarkings
    markingData:
      group: Cybernetic
  - type: CyberneticOrgan
    tier: Basic
    empEffect: Flicker
    empVulnerability: 1.5

- type: entity
  parent: [OrganBaseEyes, OrganCyberneticInternal]
  id: OrganCyberneticEyesStandard
  name: cybernetic eyes
  description: Reliable mid-tier cybernetic eyes. A clean replacement for biological ones.
  components:
  - type: Sprite
    sprite: "@RussStation/Objects/Cybernetics/cybernetic_organs.rsi"
    layers:
    - state: eyeball-plasma-l
    - state: eyeball-plasma-r
  - type: VisualOrganMarkings
    markingData:
      group: Cybernetic
  - type: CyberneticOrgan
    tier: Standard
    empEffect: Flicker
    empVulnerability: 1.0
  - type: CyberneticEyesStandard

- type: entity
  parent: [OrganBaseEyes, OrganCyberneticInternal]
  id: OrganCyberneticEyesAdvanced
  name: advanced cybernetic eyes
  description: Top-of-the-line cybernetic eyes with hardened flash suppression optics and an integrated flashlight. Immune to flashes; toggle the built-in light to see in dark areas.
  components:
  - type: Sprite
    sprite: "@RussStation/Objects/Cybernetics/cybernetic_organs.rsi"
    layers:
    - state: eyeball-bluespace-l
    - state: eyeball-bluespace-r
  - type: VisualOrganMarkings
    markingData:
      group: Cybernetic
  - type: CyberneticOrgan
    tier: Advanced
    empEffect: Flicker
    empVulnerability: 0.5
  - type: CyberneticEyes
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 6
  - type: UnpoweredFlashlight

# ============================================================
# EARS - EmpEffect: Deafen
# ============================================================

- type: entity
