      category: Lungs
    - type: Lung
    - type: Metabolizer
      stages: [Respiration]
    - type: SolutionContainerManager
      solutions:
        Lung:
          maxVol: 130.0
          canReact: false
    - type: Sprite
      layers:
        - state: lung-l
        - state: lung-r
    - type: CyberneticOrgan
      tier: Advanced
      empEffect: BreathingFailure
      empVulnerability: 0.5
    - type: CyberneticLungs

