- type: entity
  parent: BaseAction
  id: ActionSpit
  name: "[color=blue]Spit[/color]"
  description: Spit a fat wad of phlegm at something you hate.
  components:
  - type: Action
    icon: { sprite : '@RussStation/spit.rsi', state: spit }
    itemIconStyle: BigAction
    priority: 2
    # Replaces the old SpitGun's rechargeCooldown + GunComponent.FireRate throttle.
    useDelay: 0.5
    # Plays from the performer. This is what upstream's #43539 fix relies on, and it
    # replaces the fork's manual "play the sound from the mob" workaround.
    sound: !type:SoundPathSpecifier
      path: /Audio/@RussStation/Spit/russstation_sound_voice_spit_release.ogg
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileSpit
      projectileSpeed: 10
  - type: PopupOnAction
    popupType: Small
    selfMessage: action-spit-popup
    othersMessage: action-spit-popup

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBulletTrigger
  id: ProjectileSpit
  name: spit
  description: Yup, spit.
  components:
  - type: Projectile
    impactEffect: SpitImpactEffect
    damage:
      types:
        Blunt: 0
    soundHit: /Audio/@RussStation/Spit/russstation_sound_misc_waterbloop1.ogg
  - type: Sprite
    sprite: '@RussStation/spit.rsi'
    layers:
    - state: spitProjectile
      shader: unshaded
  - type: TimedDespawn
    lifetime: 0.25

- type: entity
  id: SpitImpactEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.25
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: '@RussStation/spit.rsi'
      state: impact_spit
  - type: EffectVisuals
  - type: Tag
    tags:
      - HideContextMenu
