# Maintainer verdicts on whether a feature is somewhere this server wants to go.
#
# Deliberately a separate file from `fork-features.yml`: that one records what
# the analysis found and is regenerated by the Phase 2 tooling, which would drop
# anything hand-added to it. This one is pure human judgement, is never
# generated, and outranks the analysis. A feature can be a beautiful,
# well-verified, widely-adopted graft and still be the wrong direction.
#
#   wanted      we want this; rank it first
#   partly-taken already imported here, so the useful question is how other
#               forks did it differently, not whether to take it
#   rejected    not our direction; keep it off the shortlist and say why
#
# `why` is quoted from the decision, not paraphrased into justification.

features:
  guidebook-rules-and-sop:
    fit: wanted
    why: A codified law and SOP the crew can actually look up mid-round.

  nanochat-messenger:
    fit: wanted
    why: Should replace our current messenger app, so the comparison worth having is which fork's version is the best base.

  exotic-gas-expansion:
    fit: partly-taken
    why: Mostly imported here already; what is missing is a read on whether someone more competent did it better.

  department-restructure:
    fit: rejected
    why: Not the direction we are working towards.

  extra-playable-species:
    fit: rejected
    why: Too much.

  gamemaster-and-ghost-roles:
    fit: rejected
    why: Anything with a game master is too much.

  round-modifier-presets:
    fit: rejected
    why: A game director is a game master by another name, so the same call applies.

  games-instruments-and-performance:
    fit: rejected
    why: Not really interesting.
